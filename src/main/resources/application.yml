spring:
  application:
    name: marketing-agent
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/marketing_agent;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  info:
    title: AI Marketing Agent API
    version: v1

jwt:
  secret: ${JWT_SECRET:ai-marketing-agent-secret-key-must-be-at-least-32-characters-long}
  expiration: ${JWT_EXPIRATION:86400000}

ai:
  provider: ${AI_PROVIDER:stub}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

naver:
  searchad:
    provider: ${NAVER_SEARCHAD_PROVIDER:stub}
    base-url: ${NAVER_SEARCHAD_BASE_URL:https://api.searchad.naver.com}
    customer-id: ${NAVER_CUSTOMER_ID:}
    api-key: ${NAVER_API_KEY:}
    secret-key: ${NAVER_SECRET_KEY:}
    sync-enabled: ${NAVER_SYNC_ENABLED:false}
    sync-cron: ${NAVER_SYNC_CRON:0 30 5 * * *}
    sync-days: ${NAVER_SYNC_DAYS:30}

ads:
  bid:
    # 목표 CPA. 0이면 계정 평균 CPA를 기준으로 삼는다
    target-cpa: ${ADS_TARGET_CPA:0}
    lookback-days: ${ADS_BID_LOOKBACK_DAYS:14}
    min-impressions: ${ADS_BID_MIN_IMPRESSIONS:100}
    # 1회 조정 상한 (0.2 = ±20%)
    max-change-rate: ${ADS_BID_MAX_CHANGE_RATE:0.2}
    min-bid: ${ADS_BID_MIN:70}
    max-bid: ${ADS_BID_MAX:100000}
    max-daily-applies: ${ADS_BID_MAX_DAILY_APPLIES:50}
    # true 면 승인해도 네이버에 반영하지 않고 기록만 남긴다
    dry-run: ${ADS_BID_DRY_RUN:false}
